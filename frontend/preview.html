<!-- SPDX-License-Identifier: MIT
     Dev-only preview: renders the real app against fixtures in src/preview/stub.ts so the
     UI can be inspected in a browser (screenshots, design checks) without the
     Wails shell. `npm run dev`, then open /preview.html. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>AnyProxyXa preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
<div id="root"></div>
<script>
  const boot = (what, detail) => {
    document.title = what + ' ' + detail
    const pre = document.createElement('pre')
    pre.id = 'boot-error'
    pre.style.cssText = 'all:initial;display:block;white-space:pre-wrap;font:12px monospace;color:#900;background:#fee;padding:12px'
    pre.textContent = what + '\n' + detail
    document.body?.appendChild(pre)
  }
  addEventListener('error', (e) => boot('ERR:', (e.error && e.error.stack) || e.message))
  addEventListener('unhandledrejection', (e) => boot('REJ:', (e.reason && (e.reason.stack || e.reason.message)) || String(e.reason)))
</script>
<script src="./src/preview/stub.ts" type="module"></script>
<script src="./src/main.tsx" type="module"></script>
</body>
</html>
