name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (${{ matrix.arch }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, amd64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build AnyProxy.app
        env:
          PATH: ${{ env.PATH }}:${{ github.workspace }}/go/bin:/Users/runner/go/bin
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            VERSION="$(sed -n 's/.*"productVersion": *"\([^"]*\)".*/\1/p' wails.json)"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          wails build -clean -platform "darwin/${{ matrix.arch }}" -ldflags "-s -w -X github.com/D0bby999/anyproxy/internal/update.Current=${VERSION}"
          codesign --force --deep --sign - build/bin/AnyProxy.app

      - name: Package DMG
        run: |
          mkdir -p dist/dmg-root
          cp -R build/bin/AnyProxy.app dist/dmg-root/
          ln -s /Applications dist/dmg-root/Applications
          hdiutil create -volname "AnyProxy" -srcfolder dist/dmg-root -ov -format UDZO "dist/AnyProxy-darwin-${{ matrix.arch }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: darwin-${{ matrix.arch }}
          path: dist/AnyProxy-darwin-${{ matrix.arch }}.dmg

  build-windows:
    name: Build Windows (amd64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI & NSIS
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          choco install nsis -y --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          $env:Path += ";$env:USERPROFILE\go\bin;C:\Program Files (x86)\NSIS"
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { (Get-Content wails.json | ConvertFrom-Json).info.productVersion }
          wails build -clean -platform windows/amd64 -nsis -ldflags "-s -w -X github.com/D0bby999/anyproxy/internal/update.Current=$version"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $installer = Get-ChildItem build/bin/*-installer.exe | Select-Object -First 1
          if (-not $installer) { $installer = Get-ChildItem build/bin/*.exe | Select-Object -First 1 }
          Copy-Item $installer.FullName "dist/AnyProxy-windows-amd64.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: dist/AnyProxy-windows-amd64.exe

  publish:
    name: Publish GitHub Release
    needs: [build-macos, build-windows]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums and release manifest
        run: |
          (cd dist && sha256sum AnyProxy-* > checksums.txt)
          node -e '
            const fs = require("fs");
            const manifest = JSON.parse(fs.readFileSync("latest.json", "utf8"));
            manifest.version = (process.env.GITHUB_REF_NAME || "").replace(/^v/, "");
            manifest.date = new Date().toISOString().slice(0, 10);
            const sums = Object.fromEntries(
              fs.readFileSync("dist/checksums.txt", "utf8").trim().split("\n").map((l) => {
                const [hash, file] = l.trim().split(/\s+/);
                return [file, hash];
              })
            );
            const tagUrl = (f) => `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${process.env.GITHUB_REF_NAME}/${f}`;
            manifest.assets["darwin-arm64"] = { url: tagUrl("AnyProxy-darwin-arm64.dmg"), sha256: sums["AnyProxy-darwin-arm64.dmg"] };
            manifest.assets["darwin-amd64"] = { url: tagUrl("AnyProxy-darwin-amd64.dmg"), sha256: sums["AnyProxy-darwin-amd64.dmg"] };
            manifest.assets["windows-amd64"] = { url: tagUrl("AnyProxy-windows-amd64.exe"), sha256: sums["AnyProxy-windows-amd64.exe"] };
            fs.writeFileSync("dist/latest.json", JSON.stringify(manifest, null, 2) + "\n");
          '

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/AnyProxy-darwin-arm64.dmg
            dist/AnyProxy-darwin-amd64.dmg
            dist/AnyProxy-windows-amd64.exe
            dist/checksums.txt
            dist/latest.json
